[package]
name = "libreeb"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = "0.6.3"
facet = "0.27.15"
facet-pretty = "0.23.22"
itertools = "0.13.0"
rand = "0.9.1"
thiserror = "2.0.12"
zerocopy = { version = "0.8.25", features = ["derive", "simd"] }

[dev-dependencies]
xxhash-rust = { version = "0.8.3", features = ["xxh64"] } # For tests
criterion = { version = "0.5", features = ["html_reports"] } # For benchmakrs
rstest = "0.26.1"

[[bench]]
name = "benchmark"
harness = false

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
# debug = true
# strip = false

[lib]
name = "libreeb"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# [[bin]]
# name = "eb_viewer"
# path = "src/main.rs"

[[bin]]
name = "bench_decoder"
path = "src/bench_decoders.rs"
panic = "abort"

[dependencies.pyo3]
version = "0.24.0"
# "abi3-py38" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.8
features = ["abi3-py38"]
