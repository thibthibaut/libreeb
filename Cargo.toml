[package]
name = "libreeb"
version = "0.1.0"
edition = "2021"

# ── Shared dependencies ───────────────────────────────────────────────────────

[dependencies]
color-eyre  = "0.6.3"
facet       = "0.27.15"
facet-pretty = "0.23.22"
itertools   = "0.13.0"
rand        = "0.9.1"
thiserror   = "2.0.12"
zerocopy    = { version = "0.8.25", features = ["derive", "simd"] }
image       = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# eframe / egui — same version, works for both native (glow) and WASM (WebGL)
eframe = { version = "0.31", features = ["glow"] }
egui   = "0.31"

# File picker — has WASM support (shows browser file dialog on web)
rfd = "0.15"

# ── Native-only dependencies ──────────────────────────────────────────────────

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusb = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.pyo3]
version  = "0.24.0"
features = ["abi3-py38"]

# ── WASM-only dependencies ────────────────────────────────────────────────────

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
# getrandom must opt-in to JS/WASM RNG source on wasm32-unknown-unknown
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version  = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "Navigator",
    "Usb",
    "UsbDevice",
    "UsbConfiguration",
    "UsbInterface",
    "UsbAlternateInterface",
    "UsbEndpoint",
    "UsbInTransferResult",
    "UsbOutTransferResult",
    "UsbDeviceRequestOptions",
    "UsbDeviceFilter",
    "UsbTransferStatus",
    "UsbPermissionResult",
    "HtmlCanvasElement",
    "console",
]

# ── Dev dependencies ──────────────────────────────────────────────────────────

[dev-dependencies]
xxhash-rust = { version = "0.8.3", features = ["xxh64"] }
criterion   = { version = "0.5", features = ["html_reports"] }
rstest      = "0.26.1"

# ── Bench ─────────────────────────────────────────────────────────────────────

[[bench]]
name    = "benchmark"
harness = false

# ── Build profiles ─────────────────────────────────────────────────────────────

[profile.release]
codegen-units = 1
lto           = "fat"
panic         = "abort"

# ── Library ───────────────────────────────────────────────────────────────────

[lib]
name       = "libreeb"
path       = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# ── Binaries ──────────────────────────────────────────────────────────────────

[[bin]]
name = "bench_decoder"
path = "src/bench_decoders.rs"

[[bin]]
name = "event_viewer"
path = "src/bin/event_viewer.rs"
