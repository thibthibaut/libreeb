[package]
name = "libreeb"
version = "0.1.0"
edition = "2021"

# ── Features ──────────────────────────────────────────────────────────────────

[features]
default = ["camera", "python"]
camera = ["rusb"]
python = ["pyo3"]

# ── Shared dependencies ───────────────────────────────────────────────────────

[dependencies]
itertools   = "0.13.0"
thiserror   = "2.0.12"
bytemuck    = { version = "1", features = ["derive"] }
image       = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# ── Native-only dependencies ──────────────────────────────────────────────────

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusb = { version = "0.9", optional = true }
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.pyo3]
version  = "0.24.0"
features = ["abi3-py38"]
optional = true

# ── WASM-only dependencies ────────────────────────────────────────────────────

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
# GUI deps — only needed for the WASM event_viewer binary
eframe     = { version = "0.31", features = ["glow"] }
egui       = "0.31"
egui_plot  = "0.31"
rfd        = "0.15"
web-time   = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version  = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "Navigator",
    "Usb",
    "UsbDevice",
    "UsbConfiguration",
    "UsbInterface",
    "UsbAlternateInterface",
    "UsbEndpoint",
    "UsbInTransferResult",
    "UsbOutTransferResult",
    "UsbDeviceRequestOptions",
    "UsbDeviceFilter",
    "UsbTransferStatus",
    "UsbPermissionResult",
    "HtmlCanvasElement",
    "console",
]

# ── Dev dependencies ──────────────────────────────────────────────────────────

[dev-dependencies]
xxhash-rust = { version = "0.8.3", features = ["xxh64"] }
criterion   = { version = "0.5", features = ["html_reports"] }
rstest      = "0.26.1"

# ── Bench ─────────────────────────────────────────────────────────────────────

[[bench]]
name    = "benchmark"
harness = false

# ── Build profiles ─────────────────────────────────────────────────────────────

[profile.release]
codegen-units = 1
lto           = "fat"
panic         = "abort"

[profile.bench]
inherits = "release"

# ── Library ───────────────────────────────────────────────────────────────────

[lib]
name       = "libreeb"
path       = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# ── Binaries ──────────────────────────────────────────────────────────────────

[[bin]]
name = "bench_decoder"
path = "src/bench_decoders.rs"

[[bin]]
name = "discover_camera"
path = "src/bin/discover_camera.rs"
required-features = ["camera"]

[[bin]]
name = "event_viewer"
path = "src/bin/event_viewer/main.rs"

[[bin]]
name = "tui_viewer"
path = "src/bin/tui_viewer.rs"
required-features = []
